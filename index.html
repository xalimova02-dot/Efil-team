<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Каталог манхвы</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0f0f12;
    color: #ffffff;
    font-family: Arial, sans-serif;
}

header {
    padding: 25px 20px;
    text-align: center;
    background: #17171c;
    border-bottom: 1px solid #292930;
}

header h1 {
    margin: 0;
    font-size: 28px;
}

.catalog {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
    gap: 18px;
    padding: 25px;
    max-width: 1200px;
    margin: auto;
}

.title-card {
    background: #19191f;
    border-radius: 14px;
    overflow: hidden;
    cursor: pointer;
    transition: 0.2s;
    border: 1px solid #292930;
}

.title-card:hover {
    transform: translateY(-4px);
    border-color: #55555f;
}

.title-card img {
    width: 100%;
    aspect-ratio: 2 / 3;
    object-fit: cover;
    display: block;
    background: #222;
}

.title-info {
    padding: 13px;
}

.title-info h2 {
    margin: 0;
    font-size: 17px;
    line-height: 1.3;
}

.hidden {
    display: none !important;
}

/* СТРАНИЦА ТАЙТЛА */

.title-page {
    max-width: 850px;
    margin: auto;
    padding: 25px 18px 50px;
}

.back-button {
    border: none;
    background: #292930;
    color: white;
    padding: 11px 18px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 25px;
    font-size: 15px;
}

.title-header {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
}

.title-header img {
    width: 150px;
    height: 220px;
    object-fit: cover;
    border-radius: 12px;
    background: #222;
}

.title-header h1 {
    margin-top: 0;
    font-size: 25px;
}

.chapter-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.chapter-item {
    background: #19191f;
    border: 1px solid #292930;
    border-radius: 12px;
    overflow: hidden;
}

.chapter-button {
    width: 100%;
    padding: 17px;
    background: transparent;
    color: white;
    border: none;
    text-align: left;
    font-size: 18px;
    cursor: pointer;
}

.chapter-button:hover {
    background: #222229;
}

.donate-button {
    display: block;
    margin: 0 14px 14px;
    padding: 12px;
    text-align: center;
    background: #d6a43b;
    color: #111;
    text-decoration: none;
    border-radius: 9px;
    font-weight: bold;
    cursor: pointer;
}

.donate-button:hover {
    background: #e6b64c;
}

/* ЧИТАЛКА */

.reader {
    max-width: 900px;
    margin: auto;
    padding: 15px 10px 50px;
}

.reader-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 15px;
}

.reader-top h2 {
    margin: 0;
    font-size: 20px;
}

.reader-page {
    width: 100%;
    display: block;
    margin: 0 auto;
    background: #111;
}

.reader-controls {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
}

.reader-controls button {
    border: none;
    background: #292930;
    color: white;
    padding: 11px 18px;
    border-radius: 9px;
    cursor: pointer;
}

.reader-donate {
    margin-top: 25px;
}

.copy-box {
    margin-top: 12px;
    padding: 15px;
    background: #19191f;
    border-radius: 10px;
    text-align: center;
}

.copy-number {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 10px;
}

.copy-button {
    border: none;
    background: #3b3b45;
    color: white;
    padding: 10px 16px;
    border-radius: 8px;
    cursor: pointer;
}

@media (max-width: 600px) {

    .catalog {
        grid-template-columns: repeat(2, 1fr);
        padding: 15px;
        gap: 12px;
    }

    .title-header img {
        width: 110px;
        height: 165px;
    }

    .title-header h1 {
        font-size: 20px;
    }

    .reader {
        padding-left: 0;
        padding-right: 0;
    }

    .reader-top {
        padding: 0 10px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Каталог манхвы</h1>
</header>


<!-- ========================= -->
<!-- КАТАЛОГ -->
<!-- ========================= -->

<section id="catalog" class="catalog">

    <div class="title-card"
         onclick="openTitle('happy')">

        <img
            src="Final.jpg"
            onerror="this.onerror=null; this.src='Final_92_1.jpg';"
            alt="Счастливый финал для умирающей злодейки">

        <div class="title-info">
            <h2>Счастливый финал для умирающей злодейки</h2>
        </div>

    </div>

    <!--
    СЮДА ПОЗЖЕ МОЖНО ДОБАВЛЯТЬ ДРУГИЕ ТАЙТЛЫ.

    Например:

    <div class="title-card"
         onclick="openTitle('vor')">

        <img src="vor.jpg" alt="Вор и стеклянная принцесса">

        <div class="title-info">
            <h2>Вор и стеклянная принцесса</h2>
        </div>

    </div>
    -->

</section>


<!-- ========================= -->
<!-- СПИСОК ГЛАВ -->
<!-- ========================= -->

<section id="titlePage" class="title-page hidden">

    <button class="back-button" onclick="backToCatalog()">
        ← Назад к каталогу
    </button>

    <div class="title-header">

        <img
            id="titleCover"
            src="Final.jpg"
            onerror="this.onerror=null; this.src='Final_92_1.jpg';"
            alt="Обложка">

        <div>
            <h1 id="titleName">
                Счастливый финал для умирающей злодейки
            </h1>
        </div>

    </div>

    <div id="chapterList" class="chapter-list"></div>

</section>


<!-- ========================= -->
<!-- ЧИТАЛКА -->
<!-- ========================= -->

<section id="reader" class="reader hidden">

    <div class="reader-top">

        <button class="back-button" onclick="backToChapters()">
            ← К главам
        </button>

        <h2 id="readerTitle"></h2>

    </div>

    <div id="readerPages"></div>

    <div class="reader-donate">

        <a
            class="donate-button"
            href="tel:+79635956661">
            Поддержать команду
        </a>

        <div class="copy-box">

            <div class="copy-number">
                Т-Банк
                <br>
                +7 963 595-66-61
            </div>

            <button
                class="copy-button"
                onclick="copyNumber()">
                Скопировать номер
            </button>

        </div>

    </div>

</section>


<script>

/* =====================================================
   ДАННЫЕ ТАЙТЛОВ
===================================================== */

const titles = {

    happy: {

        name: "Счастливый финал для умирающей злодейки",

        /*
         * Обложка.
         * Сначала пытаемся загрузить Final.jpg.
         * Если её нет — Final.png.
         * Если и её нет — первая страница главы 92.
         */

        cover: "Final.jpg",

        donation: {
            bank: "Т-Банк",
            phone: "+79635956661"
        },

        chapters: {

            92: [
                "Final_92_1.jpg",
                "Final_92_2.jpg",
                "Final_92_3.jpg",
                "Final_92_4.jpg",
                "Final_92_5.jpg",
                "Final_92_6.jpg",
                "Final_92_7.jpg"
            ],

            93: [
                "Final_93_1.jpg",
                "Final_93_2.jpg",
                "Final_93_3.jpg",
                "Final_93_4.jpg",
                "Final_93_5.jpg",
                "Final_93_6.jpg",
                "Final_93_7.jpg"
            ],

            94: [
                "Final_94_1.jpg",
                "Final_94_2.jpg",
                "Final_94_3.jpg",
                "Final_94_4.jpg",
                "Final_94_5.jpg",
                "Final_94_6.jpg",
                "Final_94_7.jpg",
                "Final_94_8.jpg"
            ],

            95: [
                "Final_95_1.jpg",
                "Final_95_2.jpg",
                "Final_95_3.jpg",
                "Final_95_4.jpg",
                "Final_95_5.jpg",
                "Final_95_6.jpg",
                "Final_95_7.jpg",
                "Final_95_8.jpg"
            ],

            96: [
                "Final_96_1.png",
                "Final_96_2.png",
                "Final_96_3.png",
                "Final_96_4.png",
                "Final_96_5.png",
                "Final_96_6.png",
                "Final_96_7.png",
                "Final_96_8.png",
                "Final_96_9.png",
                "Final_96_10.png"
            ],

            97: [
                "Final_97_1.png",
                "Final_97_2.png",
                "Final_97_3.png",
                "Final_97_4.png",
                "Final_97_5.png",
                "Final_97_6.png",
                "Final_97_7.png",
                "Final_97_8.png",
                "Final_97_9.png"
            ],

            98: [
                "Final_98_1.jpg",
                "Final_98_2.jpg",
                "Final_98_3.png",
                "Final_98_4.png",
                "Final_98_5.jpg",
                "Final_98_6.jpg"
            ],

            99: [
                "Final_99_1.jpg",
                "Final_99_2.jpg",
                "Final_99_3.jpg",
                "Final_99_4.jpg",
                "Final_99_5.jpg"
            ]

        }
    }

};


/* =====================================================
   ЭЛЕМЕНТЫ
===================================================== */

const catalog = document.getElementById("catalog");
const titlePage = document.getElementById("titlePage");
const reader = document.getElementById("reader");

const chapterList = document.getElementById("chapterList");
const titleName = document.getElementById("titleName");
const titleCover = document.getElementById("titleCover");

const readerTitle = document.getElementById("readerTitle");
const readerPages = document.getElementById("readerPages");


/* =====================================================
   ОТКРЫТЬ ТАЙТЛ
===================================================== */

function openTitle(id) {

    const title = titles[id];

    if (!title) {
        return;
    }

    catalog.classList.add("hidden");
    reader.classList.add("hidden");
    titlePage.classList.remove("hidden");

    titleName.textContent = title.name;

    /*
     * Обложка.
     * Если Final.jpg отсутствует,
     * пробуем Final.png,
     * затем первую страницу 92 главы.
     */

    titleCover.onerror = function() {

        if (this.dataset.fallback === "1") {

            this.onerror = null;

            this.src = title.chapters[92][0];

            return;
        }

        this.dataset.fallback = "1";
        this.src = "Final.png";
    };

    titleCover.dataset.fallback = "0";
    titleCover.src = title.cover;


    chapterList.innerHTML = "";

    /*
     * Сортировка от 92 к 99.
     */

    const chapters = Object.keys(title.chapters)
        .sort((a, b) => Number(a) - Number(b));


    chapters.forEach(chapter => {

        const item = document.createElement("div");

        item.className = "chapter-item";


        const button = document.createElement("button");

        button.className = "chapter-button";

        button.textContent = `Глава ${chapter}`;

        button.onclick = function() {

            openChapter(
                id,
                Number(chapter)
            );

        };


        const donate = document.createElement("button");

        donate.className = "donate-button";

        donate.textContent = "Поддержать команду";

        donate.onclick = function(event) {

            event.stopPropagation();

            openDonation(title);

        };


        item.appendChild(button);
        item.appendChild(donate);

        chapterList.appendChild(item);

    });

}


/* =====================================================
   ОТКРЫТЬ ГЛАВУ
===================================================== */

function openChapter(titleId, chapterNumber) {

    const title = titles[titleId];

    if (!title) {
        return;
    }

    const pages = title.chapters[chapterNumber];

    if (!pages) {
        return;
    }


    titlePage.classList.add("hidden");
    catalog.classList.add("hidden");

    reader.classList.remove("hidden");


    readerTitle.textContent =
        `${title.name} — Глава ${chapterNumber}`;


    readerPages.innerHTML = "";


    /*
     * ВАЖНО:
     * добавляем КАЖДУЮ страницу главы.
     */

    pages.forEach((file, index) => {

        const img = document.createElement("img");

        img.className = "reader-page";

        img.alt =
            `Глава ${chapterNumber}, страница ${index + 1}`;

        img.src = file;

        /*
         * Если файл не найден, показываем
         * понятное сообщение вместо пустого места.
         */

        img.onerror = function() {

            const error = document.createElement("div");

            error.style.padding = "30px 15px";
            error.style.textAlign = "center";
            error.style.background = "#19191f";
            error.style.color = "#ff7777";

            error.textContent =
                `Не удалось загрузить: ${file}`;

            this.replaceWith(error);

        };


        readerPages.appendChild(img);

    });

}


/* =====================================================
   НАЗАД К КАТАЛОГУ
===================================================== */

function backToCatalog() {

    titlePage.classList.add("hidden");
    reader.classList.add("hidden");

    catalog.classList.remove("hidden");

    window.scrollTo(0, 0);
}


/* =====================================================
   НАЗАД К ГЛАВАМ
===================================================== */

function backToChapters() {

    reader.classList.add("hidden");
    titlePage.classList.remove("hidden");

    window.scrollTo(0, 0);
}


/* =====================================================
   ДОНАТ
===================================================== */

function openDonation(title) {

    /*
     * На телефоне открываем приложение,
     * которое связано с номером телефона.
     */

    window.location.href =
        "tel:" + title.donation.phone;

}


/* =====================================================
   КОПИРОВАНИЕ НОМЕРА
===================================================== */

function copyNumber() {

    const number = "+79635956661";

    navigator.clipboard.writeText(number)
        .then(() => {

            alert("Номер скопирован");

        })
        .catch(() => {

            alert(
                "Номер для перевода: " +
                number
            );

        });

}

</script>

</body>
</html>
